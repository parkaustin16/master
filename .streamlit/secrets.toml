# Airtable credentials — fill these in before running the app.
# Obtain your Personal Access Token from https://airtable.com/account
airtable_api_key = "patXXXXXXXXXXXXXX"

# Found in the URL of your base: https://airtable.com/appXXXXXXXXXXXXXX/...
airtable_base_id = "appXXXXXXXXXXXXXX"

# The source table that contains the Period and Master Usage fields
airtable_table_name = "Capture"

# Second base — Jan–Nov 2025 historical data (same PAT token, different base)
airtable_base_id_2025    = "appXXXXXXXXXXXXXX"
airtable_table_name_2025 = "Capture"

# The destination table where aggregated results will be written
airtable_output_table_name = "Master Usage"

# Field names in the destination (Master Usage) table
# Change these only if your Airtable fields have different names
airtable_output_country_field  = "country"
airtable_output_month_field    = "month"
airtable_output_year_field     = "year"
airtable_output_usage_field    = "Master Usage"
airtable_output_platform_field = "platform"
